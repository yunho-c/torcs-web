<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>TORCS Web Renderer</title>
	<style>
		:root {
			color-scheme: dark;
			--ink: #f1ede0;
			--muted: #a7ad9d;
			--panel: rgba(15, 18, 16, 0.88);
			--panel-strong: #171b18;
			--line: #3e493f;
			--road: #2f352e;
			--red: #c9483d;
			--gold: #d4ad5f;
			--cyan: #78bdc4;
			--green: #87b56f;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #090b0a;
			color: var(--ink);
			font-family: "Aptos Mono", "SFMono-Regular", "Menlo", monospace;
			letter-spacing: 0;
		}

		button,
		select,
		input {
			font: inherit;
		}

		#renderer {
			position: fixed;
			inset: 0;
			width: 100vw;
			height: 100vh;
			display: block;
		}

		.topbar {
			position: fixed;
			top: 14px;
			left: 14px;
			right: 14px;
			display: grid;
			grid-template-columns: minmax(220px, 1fr) auto;
			gap: 12px;
			align-items: start;
			pointer-events: none;
		}

		.brand {
			font-family: "DIN Condensed", "Aptos Display", "Arial Narrow", sans-serif;
			font-size: clamp(2.6rem, 8vw, 5.8rem);
			font-weight: 700;
			line-height: 0.8;
			text-transform: uppercase;
			text-shadow: 0 3px 0 #000;
		}

		.state {
			min-width: 132px;
			padding: 10px 12px;
			border: 1px solid var(--line);
			background: var(--panel);
			text-transform: uppercase;
			text-align: right;
			color: var(--green);
			pointer-events: auto;
		}

		.controls {
			position: fixed;
			left: 14px;
			bottom: 14px;
			width: min(390px, calc(100vw - 28px));
			display: grid;
			gap: 10px;
			padding: 12px;
			border: 1px solid var(--line);
			background: var(--panel);
			backdrop-filter: blur(8px);
		}

		.row {
			display: grid;
			grid-template-columns: repeat(4, minmax(0, 1fr));
			gap: 8px;
		}

		.assets {
			grid-template-columns: 1fr 1fr;
		}

		button,
		select,
		input[type="number"] {
			min-height: 38px;
			border: 1px solid var(--line);
			border-radius: 4px;
			background: var(--panel-strong);
			color: var(--ink);
		}

		button {
			cursor: pointer;
			text-transform: uppercase;
		}

		button:disabled {
			color: #62685c;
			cursor: not-allowed;
		}

		#start {
			background: var(--red);
			border-color: var(--red);
		}

		label {
			display: grid;
			gap: 5px;
			color: var(--muted);
			font-size: 0.72rem;
			text-transform: uppercase;
		}

		input[type="range"] {
			width: 100%;
			accent-color: var(--cyan);
		}

		input[type="number"],
		select {
			width: 100%;
			padding: 0 8px;
		}

		.hud {
			position: fixed;
			right: 14px;
			bottom: 14px;
			width: min(520px, calc(100vw - 28px));
			display: grid;
			grid-template-columns: repeat(4, minmax(0, 1fr));
			border: 1px solid var(--line);
			background: var(--panel);
			backdrop-filter: blur(8px);
		}

		.metric {
			min-height: 70px;
			padding: 10px;
			border-right: 1px solid var(--line);
			border-bottom: 1px solid var(--line);
		}

		.metric:nth-child(4n) {
			border-right: 0;
		}

		.metric span {
			display: block;
			color: var(--muted);
			font-size: 0.7rem;
			text-transform: uppercase;
		}

		.metric strong {
			display: block;
			margin-top: 7px;
			font-size: clamp(1.05rem, 2.4vw, 1.75rem);
			line-height: 1;
		}

		@media (max-width: 760px) {
			.topbar {
				grid-template-columns: 1fr;
			}

			.state {
				width: max-content;
				text-align: left;
			}

			.controls {
				bottom: 220px;
			}

			.hud {
				left: 14px;
				right: 14px;
				width: auto;
				grid-template-columns: repeat(2, minmax(0, 1fr));
			}

			.metric:nth-child(2n) {
				border-right: 0;
			}

			.metric:nth-child(4n) {
				border-right: 0;
			}
		}
	</style>
</head>
<body>
	<canvas id="renderer"></canvas>

	<div class="topbar">
		<div class="brand">TORCS Web</div>
		<div class="state" id="state">loading</div>
	</div>

	<form class="controls" onsubmit="return false">
		<div class="row">
			<button id="start" type="button">Start</button>
			<button id="run" type="button">Run</button>
			<button id="step" type="button">Step</button>
			<button id="reset" type="button">Reset</button>
		</div>
		<div class="row assets">
			<label>Track
				<select id="track">
					<option value="/torcs/data/tracks/e-track-1/e-track-1.xml">E-Track 1</option>
					<option value="/torcs/data/tracks/g-track-1/g-track-1.xml">CG Speedway 1</option>
				</select>
			</label>
			<label>Car
				<select id="car">
					<option value="/torcs/data/cars/models/kc-2000gt/kc-2000gt.xml">kc-2000gt</option>
					<option value="/torcs/data/cars/models/kc-a110/kc-a110.xml">kc-a110</option>
				</select>
			</label>
		</div>
		<div class="row assets">
			<label>Camera
				<select id="camera">
					<option value="chase">Chase</option>
					<option value="onboard">Onboard</option>
					<option value="top">Top</option>
				</select>
			</label>
			<label>Gear
				<input id="gear-input" type="number" min="-1" max="5" step="1" value="1">
			</label>
		</div>
		<label>Steer
			<input id="steer" type="range" min="-1" max="1" step="0.01" value="0">
		</label>
		<label>Throttle
			<input id="accel" type="range" min="0" max="1" step="0.01" value="0">
		</label>
		<label>Brake
			<input id="brake" type="range" min="0" max="1" step="0.01" value="0">
		</label>
		<label>Clutch
			<input id="clutch" type="range" min="0" max="1" step="0.01" value="0">
		</label>
	</form>

	<div class="hud">
		<div class="metric"><span>Time</span><strong id="time">0.000</strong></div>
		<div class="metric"><span>Speed km/h</span><strong id="speed">0.0</strong></div>
		<div class="metric"><span>Gear</span><strong id="gear">0</strong></div>
		<div class="metric"><span>RPM</span><strong id="rpm">0</strong></div>
		<div class="metric"><span>Lap</span><strong id="lap">0</strong></div>
		<div class="metric"><span>Progress %</span><strong id="progress">0.0</strong></div>
		<div class="metric"><span>Segment</span><strong id="segment">0</strong></div>
		<div class="metric"><span>Offset</span><strong id="offset">0.00</strong></div>
	</div>

	<script src="./torcs_web_probe.js"></script>
	<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
			}
		}
	</script>
	<script type="module" src="./renderer/main.js"></script>
</body>
</html>
