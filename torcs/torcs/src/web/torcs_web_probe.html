<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>TORCS WASM Probe</title>
	<style>
		:root {
			color-scheme: dark;
			--bg: #10110f;
			--panel: #181a17;
			--panel-2: #20231f;
			--ink: #f0eee5;
			--muted: #9ba190;
			--line: #3a4037;
			--red: #d24c3f;
			--green: #81b66f;
			--cyan: #79b8bd;
			--shadow: rgba(0, 0, 0, 0.36);
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			min-height: 100%;
			background: var(--bg);
			color: var(--ink);
			font-family: "Aptos Mono", "SFMono-Regular", "Menlo", monospace;
			letter-spacing: 0;
		}

		body {
			padding: 18px;
		}

		button,
		input {
			font: inherit;
		}

		.shell {
			display: grid;
			grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
			gap: 14px;
			max-width: 1280px;
			margin: 0 auto;
		}

		header {
			grid-column: 1 / -1;
			display: flex;
			align-items: end;
			justify-content: space-between;
			gap: 16px;
			border-bottom: 1px solid var(--line);
			padding-bottom: 12px;
		}

		h1 {
			margin: 0;
			font-family: "DIN Condensed", "Aptos Display", "Arial Narrow", sans-serif;
			font-size: clamp(2rem, 7vw, 5rem);
			font-weight: 700;
			line-height: 0.85;
			letter-spacing: 0;
			text-transform: uppercase;
		}

		.status {
			display: grid;
			gap: 4px;
			min-width: 170px;
			text-align: right;
			color: var(--muted);
			font-size: 0.8rem;
			text-transform: uppercase;
		}

		.status strong {
			color: var(--green);
			font-size: 1.15rem;
		}

		.panel {
			background: var(--panel);
			border: 1px solid var(--line);
			border-radius: 6px;
			box-shadow: 0 16px 38px var(--shadow);
		}

		.controls {
			display: grid;
			gap: 14px;
			padding: 14px;
		}

		.toolbar {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 8px;
		}

		button {
			min-height: 42px;
			border: 1px solid var(--line);
			border-radius: 4px;
			background: var(--panel-2);
			color: var(--ink);
			cursor: pointer;
			text-transform: uppercase;
		}

		button:disabled {
			color: #676d60;
			cursor: not-allowed;
		}

		button.primary {
			background: var(--red);
			border-color: var(--red);
			color: #fff7ef;
		}

		button.active {
			background: var(--green);
			border-color: var(--green);
			color: #071006;
		}

		label {
			display: grid;
			gap: 6px;
			color: var(--muted);
			font-size: 0.76rem;
			text-transform: uppercase;
		}

		input[type="range"] {
			width: 100%;
			accent-color: var(--cyan);
		}

		input[type="number"] {
			width: 100%;
			min-height: 38px;
			border: 1px solid var(--line);
			border-radius: 4px;
			background: #0f120e;
			color: var(--ink);
			padding: 0 10px;
		}

		select {
			width: 100%;
			min-height: 38px;
			border: 1px solid var(--line);
			border-radius: 4px;
			background: #0f120e;
			color: var(--ink);
			padding: 0 10px;
		}

		.telemetry {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			border-top: 1px solid var(--line);
		}

		.metric {
			min-height: 78px;
			padding: 12px;
			border-right: 1px solid var(--line);
			border-bottom: 1px solid var(--line);
		}

		.metric:nth-child(2n) {
			border-right: 0;
		}

		.metric span {
			display: block;
			color: var(--muted);
			font-size: 0.72rem;
			text-transform: uppercase;
		}

		.metric strong {
			display: block;
			margin-top: 8px;
			font-size: clamp(1.35rem, 3vw, 2.5rem);
			font-weight: 700;
			line-height: 1;
			color: var(--ink);
		}

		.stage {
			position: relative;
			min-height: 620px;
			overflow: hidden;
		}

		canvas {
			display: block;
			width: 100%;
			height: 100%;
			min-height: 620px;
			background:
				linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
				linear-gradient(0deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
				#0b0d0b;
			background-size: 28px 28px;
		}

		.strip {
			position: absolute;
			left: 14px;
			right: 14px;
			bottom: 14px;
			display: grid;
			grid-template-columns: repeat(8, minmax(0, 1fr));
			border: 1px solid var(--line);
			background: rgba(16, 17, 15, 0.84);
			backdrop-filter: blur(6px);
		}

		.strip div {
			padding: 10px;
			border-right: 1px solid var(--line);
			color: var(--muted);
			font-size: 0.72rem;
			text-transform: uppercase;
		}

		.strip div:last-child {
			border-right: 0;
		}

		.strip strong {
			display: block;
			margin-top: 5px;
			color: var(--ink);
			font-size: 1rem;
		}

		@media (max-width: 840px) {
			body {
				padding: 10px;
			}

			.shell {
				grid-template-columns: 1fr;
			}

			header {
				align-items: start;
				flex-direction: column;
			}

			.status {
				text-align: left;
			}

			.stage,
			canvas {
				min-height: 420px;
			}

			.strip {
				grid-template-columns: repeat(2, minmax(0, 1fr));
			}

			.strip div:nth-child(2n) {
				border-right: 0;
			}
		}
	</style>
</head>
<body>
	<main class="shell">
		<header>
			<h1>TORCS WASM</h1>
			<div class="status">
				<span>Runtime</span>
				<strong id="runtime-state">loading</strong>
			</div>
		</header>

		<section class="panel controls" aria-label="Controls">
			<div class="toolbar">
				<button class="primary" id="start">Start</button>
				<button id="step">Step</button>
				<button id="run">Run</button>
				<button id="shutdown">Shutdown</button>
			</div>

			<label>
				Track
				<select id="track-select">
					<option value="/torcs/data/tracks/e-track-1/e-track-1.xml">E-Track 1</option>
					<option value="/torcs/data/tracks/g-track-1/g-track-1.xml">CG Speedway 1</option>
				</select>
			</label>
			<label>
				Car
				<select id="car-select">
					<option value="/torcs/data/cars/models/kc-2000gt/kc-2000gt.xml">kc-2000gt</option>
					<option value="/torcs/data/cars/models/kc-a110/kc-a110.xml">kc-a110</option>
				</select>
			</label>

			<label>
				Steer
				<input id="steer" type="range" min="-1" max="1" step="0.01" value="0">
			</label>
			<label>
				Throttle
				<input id="accel" type="range" min="0" max="1" step="0.01" value="0">
			</label>
			<label>
				Brake
				<input id="brake" type="range" min="0" max="1" step="0.01" value="0">
			</label>
			<label>
				Clutch
				<input id="clutch" type="range" min="0" max="1" step="0.01" value="0">
			</label>
			<label>
				Gear
				<input id="gear" type="number" min="-1" max="5" step="1" value="1">
			</label>

			<div class="telemetry" aria-label="Telemetry">
				<div class="metric"><span>Time</span><strong id="time">0.000</strong></div>
				<div class="metric"><span>Speed</span><strong id="speed">0.000</strong></div>
				<div class="metric"><span>Fuel</span><strong id="fuel">0.000</strong></div>
				<div class="metric"><span>Gear</span><strong id="gear-state">0</strong></div>
				<div class="metric"><span>Engine</span><strong id="engine-rpm">0.000</strong></div>
				<div class="metric"><span>Wheel</span><strong id="wheel-spin">0.000</strong></div>
				<div class="metric"><span>Lap</span><strong id="lap-count">0</strong></div>
				<div class="metric"><span>Progress</span><strong id="lap-progress">0.000</strong></div>
				<div class="metric"><span>Lap Time</span><strong id="lap-time">0.000</strong></div>
				<div class="metric"><span>Top</span><strong id="top-speed">0.000</strong></div>
			</div>
		</section>

		<section class="panel stage" aria-label="Simulation viewport">
			<canvas id="viewport" width="1100" height="720"></canvas>
			<div class="strip">
				<div>X<strong id="pos-x">0.000</strong></div>
				<div>Y<strong id="pos-y">0.000</strong></div>
				<div>Segment<strong id="segment">0</strong></div>
				<div>Line<strong id="track-distance">0.000</strong></div>
				<div>Raced<strong id="distance-raced">0.000</strong></div>
				<div>Offset<strong id="track-offset">0.000</strong></div>
				<div>Place<strong id="race-position">0</strong></div>
				<div>State<strong id="state">idle</strong></div>
			</div>
		</section>
	</main>

	<script src="./torcs_web_probe.js"></script>
	<script>
		const els = {
			state: document.getElementById("state"),
			runtimeState: document.getElementById("runtime-state"),
			start: document.getElementById("start"),
			step: document.getElementById("step"),
			run: document.getElementById("run"),
			shutdown: document.getElementById("shutdown"),
			trackSelect: document.getElementById("track-select"),
			carSelect: document.getElementById("car-select"),
			steer: document.getElementById("steer"),
			accel: document.getElementById("accel"),
			brake: document.getElementById("brake"),
			clutch: document.getElementById("clutch"),
			gear: document.getElementById("gear"),
			time: document.getElementById("time"),
			speed: document.getElementById("speed"),
			fuel: document.getElementById("fuel"),
			gearState: document.getElementById("gear-state"),
			engineRpm: document.getElementById("engine-rpm"),
			wheelSpin: document.getElementById("wheel-spin"),
			lapCount: document.getElementById("lap-count"),
			lapProgress: document.getElementById("lap-progress"),
			lapTime: document.getElementById("lap-time"),
			topSpeed: document.getElementById("top-speed"),
			x: document.getElementById("pos-x"),
			y: document.getElementById("pos-y"),
			segment: document.getElementById("segment"),
			trackDistance: document.getElementById("track-distance"),
			distanceRaced: document.getElementById("distance-raced"),
			trackOffset: document.getElementById("track-offset"),
			racePosition: document.getElementById("race-position"),
			canvas: document.getElementById("viewport"),
		};

		let moduleInstance = null;
		let running = false;
		let active = false;
		let raf = 0;
		let car = {
			x: 0,
			y: 0,
			z: 0,
			yaw: 0,
			speed: 0,
			fuel: 0,
			time: 0,
			engineRpm: 0,
			gear: 0,
			wheelSpin: 0,
			lapCount: 0,
			lapProgress: 0,
			currentLapTime: 0,
			distanceRaced: 0,
			racePosition: 0,
			topSpeed: 0,
			corners: [],
			trackSegmentId: 0,
			trackDistanceFromStart: 0,
			trackToMiddle: 0,
		};
		const keys = new Set();
		const controlKeyCodes = new Set([
			"ArrowLeft",
			"ArrowRight",
			"ArrowUp",
			"ArrowDown",
			"KeyA",
			"KeyD",
			"KeyW",
			"KeyS",
			"Space",
			"KeyQ",
			"KeyE",
		]);
		const movementKeyCodes = new Set([
			"ArrowLeft",
			"ArrowRight",
			"ArrowUp",
			"ArrowDown",
			"KeyA",
			"KeyD",
			"KeyW",
			"KeyS",
			"Space",
		]);
		let track = {
			center: [],
			right: [],
			left: [],
			bounds: null,
			length: 0,
			width: 0,
			segments: 0,
		};

		function call(name, returnType, argTypes = [], args = []) {
			return moduleInstance.ccall(name, returnType, argTypes, args);
		}

		function setStatus(value) {
			els.runtimeState.textContent = value;
			els.state.textContent = value;
		}

		function setEnabled(enabled) {
			els.start.disabled = !moduleInstance;
			els.step.disabled = !enabled;
			els.run.disabled = !enabled;
			els.shutdown.disabled = !enabled;
		}

		function setInputValue(input, value) {
			input.value = String(value);
		}

		function changeGear(delta) {
			const min = Number(els.gear.min);
			const max = Number(els.gear.max);
			const next = Math.max(min, Math.min(max, Number(els.gear.value) + delta));
			setInputValue(els.gear, next);
			applyControls();
		}

		function syncKeyboardControls() {
			const left = keys.has("ArrowLeft") || keys.has("KeyA");
			const right = keys.has("ArrowRight") || keys.has("KeyD");
			const throttle = keys.has("ArrowUp") || keys.has("KeyW");
			const brake = keys.has("ArrowDown") || keys.has("KeyS") || keys.has("Space");

			setInputValue(els.steer, left === right ? 0 : (left ? -1 : 1));
			setInputValue(els.accel, throttle ? 1 : 0);
			setInputValue(els.brake, brake ? 1 : 0);
			applyControls();
		}

		function handleKey(event, pressed) {
			if (!controlKeyCodes.has(event.code)) {
				return;
			}
			event.preventDefault();

			if (pressed) {
				keys.add(event.code);
				if (!event.repeat && event.code === "KeyE") {
					changeGear(1);
					return;
				} else if (!event.repeat && event.code === "KeyQ") {
					changeGear(-1);
					return;
				}
			} else {
				keys.delete(event.code);
			}

			if (movementKeyCodes.has(event.code)) {
				syncKeyboardControls();
			}
		}

		function applyControls() {
			if (!active) {
				return;
			}
			// The web UI is right-positive; TORCS control input is left-positive.
			const torcsSteer = -Number(els.steer.value);
			call(
				"torcs_web_runtime_set_controls",
				"number",
				["number", "number", "number", "number", "number"],
				[
					torcsSteer,
					Number(els.accel.value),
					Number(els.brake.value),
					Number(els.clutch.value),
					Number(els.gear.value),
				],
			);
		}

		function sample() {
			if (!active) {
				return;
			}
			car = {
				time: call("torcs_web_runtime_get_time", "number"),
				x: call("torcs_web_runtime_get_car_x", "number"),
				y: call("torcs_web_runtime_get_car_y", "number"),
				z: call("torcs_web_runtime_get_car_z", "number"),
				yaw: call("torcs_web_runtime_get_car_yaw", "number"),
				speed: call("torcs_web_runtime_get_car_speed", "number"),
				fuel: call("torcs_web_runtime_get_car_fuel", "number"),
				engineRpm: call("torcs_web_runtime_get_engine_rpm", "number"),
				gear: call("torcs_web_runtime_get_gear", "number"),
				wheelSpin: call("torcs_web_runtime_get_wheel_spin_velocity", "number", ["number"], [0]),
				lapCount: call("torcs_web_runtime_get_lap_count", "number"),
				lapProgress: call("torcs_web_runtime_get_lap_progress", "number"),
				currentLapTime: call("torcs_web_runtime_get_current_lap_time", "number"),
				distanceRaced: call("torcs_web_runtime_get_distance_raced", "number"),
				racePosition: call("torcs_web_runtime_get_race_position", "number"),
				topSpeed: call("torcs_web_runtime_get_top_speed", "number"),
				corners: [0, 1, 3, 2].map((index) => ({
					x: call("torcs_web_runtime_get_car_corner_x", "number", ["number"], [index]),
					y: call("torcs_web_runtime_get_car_corner_y", "number", ["number"], [index]),
				})),
				trackSegmentId: call("torcs_web_runtime_get_car_track_segment_id", "number"),
				trackDistanceFromStart: call("torcs_web_runtime_get_car_track_distance_from_start", "number"),
				trackToMiddle: call("torcs_web_runtime_get_car_track_to_middle", "number"),
			};
			els.time.textContent = car.time.toFixed(3);
			els.speed.textContent = car.speed.toFixed(3);
			els.fuel.textContent = car.fuel.toFixed(3);
			els.gearState.textContent = String(car.gear);
			els.engineRpm.textContent = car.engineRpm.toFixed(1);
			els.wheelSpin.textContent = car.wheelSpin.toFixed(1);
			els.lapCount.textContent = String(car.lapCount);
			els.lapProgress.textContent = car.lapProgress.toFixed(3);
			els.lapTime.textContent = car.currentLapTime.toFixed(3);
			els.topSpeed.textContent = car.topSpeed.toFixed(3);
			els.x.textContent = car.x.toFixed(3);
			els.y.textContent = car.y.toFixed(3);
			els.segment.textContent = String(car.trackSegmentId);
			els.trackDistance.textContent = car.trackDistanceFromStart.toFixed(3);
			els.distanceRaced.textContent = car.distanceRaced.toFixed(3);
			els.trackOffset.textContent = car.trackToMiddle.toFixed(3);
			els.racePosition.textContent = String(car.racePosition);
		}

		function sampleTrack() {
			track = {
				center: [],
				right: [],
				left: [],
				bounds: null,
				length: call("torcs_web_runtime_get_track_length", "number"),
				width: call("torcs_web_runtime_get_track_width", "number"),
				segments: call("torcs_web_runtime_get_track_segment_count", "number"),
			};

			const samples = call("torcs_web_runtime_get_track_sample_count", "number");
			const bounds = {
				minX: Number.POSITIVE_INFINITY,
				minY: Number.POSITIVE_INFINITY,
				maxX: Number.NEGATIVE_INFINITY,
				maxY: Number.NEGATIVE_INFINITY,
			};
			const readPoint = (index, side) => ({
				x: call("torcs_web_runtime_get_track_sample_x", "number", ["number", "number"], [index, side]),
				y: call("torcs_web_runtime_get_track_sample_y", "number", ["number", "number"], [index, side]),
			});
			const extendBounds = (point) => {
				bounds.minX = Math.min(bounds.minX, point.x);
				bounds.minY = Math.min(bounds.minY, point.y);
				bounds.maxX = Math.max(bounds.maxX, point.x);
				bounds.maxY = Math.max(bounds.maxY, point.y);
			};

			for (let i = 0; i < samples; i += 1) {
				const right = readPoint(i, 0);
				const center = readPoint(i, 1);
				const left = readPoint(i, 2);
				track.right.push(right);
				track.center.push(center);
				track.left.push(left);
				extendBounds(right);
				extendBounds(left);
			}

			if (Number.isFinite(bounds.minX)) {
				track.bounds = bounds;
			}
		}

		function step() {
			if (!active) {
				return;
			}
			applyControls();
			call("torcs_web_runtime_step", "number", ["number"], [1 / 60]);
			sample();
			draw();
		}

		function draw() {
			const canvas = els.canvas;
			const ctx = canvas.getContext("2d");
			const rect = canvas.getBoundingClientRect();
			const ratio = window.devicePixelRatio || 1;
			const nextWidth = Math.max(1, Math.floor(rect.width * ratio));
			const nextHeight = Math.max(1, Math.floor(rect.height * ratio));
			if (canvas.width !== nextWidth || canvas.height !== nextHeight) {
				canvas.width = nextWidth;
				canvas.height = nextHeight;
			}
			const w = canvas.width;
			const h = canvas.height;
			ctx.clearRect(0, 0, w, h);

			ctx.strokeStyle = "rgba(240, 238, 229, 0.08)";
			ctx.lineWidth = Math.max(1, ratio);
			for (let x = 0; x <= w; x += 44 * ratio) {
				ctx.beginPath();
				ctx.moveTo(x, 0);
				ctx.lineTo(x, h);
				ctx.stroke();
			}
			for (let y = 0; y <= h; y += 44 * ratio) {
				ctx.beginPath();
				ctx.moveTo(0, y);
				ctx.lineTo(w, y);
				ctx.stroke();
			}

			let view = null;
			if (track.bounds) {
				const pad = 58 * ratio;
				const spanX = Math.max(1, track.bounds.maxX - track.bounds.minX);
				const spanY = Math.max(1, track.bounds.maxY - track.bounds.minY);
				const scale = Math.min((w - pad * 2) / spanX, (h - pad * 2) / spanY);
				const midX = (track.bounds.minX + track.bounds.maxX) * 0.5;
				const midY = (track.bounds.minY + track.bounds.maxY) * 0.5;
				view = {
					scale,
					toCanvas(point) {
						return {
							x: w * 0.5 + (point.x - midX) * scale,
							y: h * 0.5 - (point.y - midY) * scale,
						};
					},
				};

				ctx.beginPath();
				for (const [index, point] of track.left.entries()) {
					const p = view.toCanvas(point);
					if (index === 0) {
						ctx.moveTo(p.x, p.y);
					} else {
						ctx.lineTo(p.x, p.y);
					}
				}
				for (let i = track.right.length - 1; i >= 0; i -= 1) {
					const p = view.toCanvas(track.right[i]);
					ctx.lineTo(p.x, p.y);
				}
				ctx.closePath();
				ctx.fillStyle = "#20231f";
				ctx.fill();
				ctx.strokeStyle = "#f0eee5";
				ctx.lineWidth = Math.max(2, ratio * 2);
				ctx.stroke();

				ctx.beginPath();
				for (const [index, point] of track.center.entries()) {
					const p = view.toCanvas(point);
					if (index === 0) {
						ctx.moveTo(p.x, p.y);
					} else {
						ctx.lineTo(p.x, p.y);
					}
				}
				ctx.closePath();
				ctx.setLineDash([8 * ratio, 12 * ratio]);
				ctx.strokeStyle = "rgba(121, 184, 189, 0.58)";
				ctx.lineWidth = Math.max(1, ratio);
				ctx.stroke();
				ctx.setLineDash([]);

				if (track.center.length > 0) {
					const start = view.toCanvas(track.center[0]);
					ctx.fillStyle = "#81b66f";
					ctx.fillRect(start.x - 4 * ratio, start.y - 4 * ratio, 8 * ratio, 8 * ratio);
				}
			}

			const carPoint = view ? view.toCanvas(car) : { x: w * 0.5, y: h * 0.5 };
			const carCorners = view ? car.corners.map((point) => view.toCanvas(point)) : [];

			ctx.fillStyle = "#d24c3f";
			ctx.strokeStyle = "#f0eee5";
			ctx.lineWidth = Math.max(2, ratio * 2);

			const hasCarCorners = carCorners.length === 4 &&
				carCorners.every((point) => Number.isFinite(point.x) && Number.isFinite(point.y)) &&
				Math.hypot(carCorners[0].x - carCorners[1].x, carCorners[0].y - carCorners[1].y) > 2 * ratio;

			if (hasCarCorners) {
				ctx.beginPath();
				ctx.moveTo(carCorners[0].x, carCorners[0].y);
				for (let i = 1; i < carCorners.length; i += 1) {
					ctx.lineTo(carCorners[i].x, carCorners[i].y);
				}
				ctx.closePath();
				ctx.fill();
				ctx.stroke();
			} else {
				const carLength = Math.max(16 * ratio, Math.min(34 * ratio, (track.width || 12) * (view ? view.scale : ratio) * 0.65));
				const carWidth = carLength * 0.48;

				ctx.save();
				ctx.translate(carPoint.x, carPoint.y);
				ctx.rotate(-car.yaw);
				ctx.beginPath();
				ctx.moveTo(carLength * 0.55, 0);
				ctx.lineTo(-carLength * 0.38, -carWidth * 0.5);
				ctx.lineTo(-carLength * 0.22, 0);
				ctx.lineTo(-carLength * 0.38, carWidth * 0.5);
				ctx.closePath();
				ctx.fill();
				ctx.stroke();
				ctx.restore();
			}

			ctx.fillStyle = "#79b8bd";
			ctx.fillRect(carPoint.x - 2 * ratio, carPoint.y - 2 * ratio, 4 * ratio, 4 * ratio);
		}

		async function startRuntime() {
			const rc = call(
				"torcs_web_runtime_start_with_files",
				"number",
				["string", "string"],
				[els.trackSelect.value, els.carSelect.value],
			);
			active = rc === 0;
			running = false;
			els.run.textContent = "Run";
			els.run.classList.remove("active");
			setStatus(active ? "ready" : "failed");
			setEnabled(active);
			applyControls();
			sampleTrack();
			sample();
			draw();
		}

		function shutdownRuntime() {
			running = false;
			active = false;
			els.run.textContent = "Run";
			els.run.classList.remove("active");
			if (moduleInstance) {
				call("torcs_web_runtime_shutdown", null);
			}
			setStatus("stopped");
			setEnabled(false);
			track = { center: [], right: [], left: [], bounds: null, length: 0, width: 0, segments: 0 };
			draw();
		}

		function loop() {
			if (running) {
				step();
				raf = requestAnimationFrame(loop);
			}
		}

		els.start.addEventListener("click", startRuntime);
		els.step.addEventListener("click", step);
		els.run.addEventListener("click", () => {
			if (!active) {
				return;
			}
			running = !running;
			els.run.textContent = running ? "Pause" : "Run";
			els.run.classList.toggle("active", running);
			cancelAnimationFrame(raf);
			if (running) {
				loop();
			}
		});
		els.shutdown.addEventListener("click", shutdownRuntime);
		for (const input of [els.steer, els.accel, els.brake, els.clutch, els.gear]) {
			input.addEventListener("input", applyControls);
		}
		window.addEventListener("keydown", (event) => handleKey(event, true));
		window.addEventListener("keyup", (event) => handleKey(event, false));
		window.addEventListener("resize", draw);

		setEnabled(false);
		draw();

		TorcsWebProbe({ locateFile: (path) => path })
			.then((loaded) => {
				moduleInstance = loaded;
				setStatus("loaded");
				setEnabled(false);
				els.start.disabled = false;
			})
			.catch((error) => {
				console.error(error);
				setStatus("failed");
			});
	</script>
</body>
</html>
